name: Update free subscriptions

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run aggregator
        run: |
          python scripts/aggregate.py
          python scripts/probe.py --max-nodes "$MAX_PROBE_NODES" --concurrency "$PROBE_CONCURRENCY"
          python scripts/sanitize.py
        env:
          MAX_PROBE_NODES: "20000"
          PROBE_CONCURRENCY: "120"
      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto update free subscription list"
            git push
          fi
